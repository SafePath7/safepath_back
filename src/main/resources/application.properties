spring.application.name=backend
spring.flyway.enabled=false
spring.profiles.active=local

# Event media (photos, voice, etc.) is stored in S3. Credentials come from the AWS SDK default chain.
safepath.media.provider=s3
safepath.media.s3.bucket=${SAFEPATH_MEDIA_S3_BUCKET:safepath-dev-risk-media-kr}
safepath.media.s3.region=${SAFEPATH_MEDIA_S3_REGION:ap-northeast-2}
# Media files are deleted after this many days and storage_url is set to null; event rows stay.
# Keep in sync with the S3 lifecycle rule "risk-events-expire-7d" on the media bucket.
safepath.media.retention-days=7
# Match the 10MB limit enforced by S3EventMediaStorage (Spring's default is 1MB).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB